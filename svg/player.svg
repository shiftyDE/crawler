  <!-- Kopf -->
  <rect x="13" y="7" width="6" height="6" fill="#f5a623" stroke="#d4880f" stroke-width="1"/>
  <!-- Augen -->
  <rect x="14" y="8" width="2" height="2" fill="#1a1a1a"/>
  <rect x="18" y="8" width="2" height="2" fill="#1a1a1a"/>
  <!-- Mund -->
  <rect x="15" y="12" width="2" height="1" fill="#8b0000"/>
  <!-- Arme -->
  <rect x="8" y="12" width="3" height="2" fill="#3a7bd5" stroke="#2a5f9e" stroke-width="1"/>
  <rect x="21" y="12" width="3" height="2" fill="#3a7bd5" stroke="#2a5f9e" stroke-width="1"/>
  <!-- Beine -->
  <rect x="12" y="20" width="3" height="3" fill="#3a7bd5" stroke="#2a5f9e" stroke-width="1"/>
  <rect x="19" y="20" width="3" height="3" fill="#3a7bd5" stroke="#2a5f9e" stroke-width="1"/>
</svg>