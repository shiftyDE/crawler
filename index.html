<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Pixel Map</title>
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <div class="map">
    <!-- Bäume -->
    <div class="tree" style="top: 20px; left: 30px;"></div>
    <div class="tree" style="top: 50px; left: 750px;"></div>
    <div class="tree" style="top: 100px; left: 100px;"></div>
    <div class="tree" style="top: 70px; left: 750px;"></div>
    <div class="tree" style="top: 400px; left: 200px;"></div>
    <div class="tree" style="top: 150px; left: 650px;"></div>
    <div class="tree" style="top: 350px; left: 50px;"></div>
    <div class="tree" style="top: 550px; left: 500px;"></div>

    <!-- Steine -->
    <div class="stone" style="top: 120px; left: 150px;"></div>
    <div class="stone" style="top: 300px; left: 600px;"></div>
    <div class="stone" style="top: 450px; left: 250px;"></div>
    <div class="stone" style="top: 200px; left: 400px;"></div>
    <div class="stone" style="top: 500px; left: 700px;"></div>

    <!-- Wasser -->
    <div class="water" style="top: 350px; left: 100px;"></div>
    <div class="water" style="top: 150px; left: 650px;"></div>

    <!-- Blumen -->
    <div class="flower" style="top: 180px; left: 200px;"></div>
    <div class="flower" style="top: 420px; left: 350px;"></div>
    <div class="flower" style="top: 300px; left: 500px;"></div>
    <div class="flower" style="top: 50px; left: 450px;"></div>
    <div class="flower" style="top: 480px; left: 150px;"></div>

    <!-- Spieler -->
    <div class="player" style="top: 280px; left: 385px;">
      <div class="head"></div>
      <div class="body"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
      <div class="tail"></div>
    </div>
  </div>
</body>
</html>
